<article class="card">
  <a href="{{ p.get_absolute_url }}" class="thumb">
    {% if p.image %}<img src="{{ p.image.url }}" alt="{{ p.name }}" loading="lazy">{% else %}<span class="noimg">🧶</span>{% endif %}
  </a>
  <div class="card-body">
    <h3 class="card-title"><a href="{{ p.get_absolute_url }}">{{ p.name }}</a></h3>
    <p class="card-desc">{{ p.description }}</p>
    <p class="price">R$ {{ p.price|floatformat:2 }}</p>
    {% if p.in_stock %}
      <form method="post" action="{% url 'cart:add' p.id %}" class="card-action">{% csrf_token %}
        <input type="hidden" name="quantity" value="1">
        <input type="hidden" name="next" value="{{ request.get_full_path }}">
        <button class="btn block" type="submit">Adicionar ao carrinho</button>
      </form>
    {% else %}
      <div class="card-action"><span class="btn block disabled">Esgotado</span></div>
    {% endif %}
  </div>
</article>
